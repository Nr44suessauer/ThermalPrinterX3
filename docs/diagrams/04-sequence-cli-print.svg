113" y1="377.078" x2="630.96" y2="377.078" style="stroke:#181818;stroke-width:1;"/><text x="205.113" y="371.269" fill="#000" font-size="13" font-weight="700">7</text><text x="216.549" y="371.269" fill="#000" font-size="13" textLength="56.238">connect()</text><path d="M620.96,389.078 L683.419,389.078 L683.419,398.784 L673.419,408.784 L620.96,408.784 L620.96,389.078" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="620.96" y="389.078" width="226.144" height="74.412" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="635.96" y="403.975" fill="#000" font-size="13" textLength="17.459" font-weight="700">alt</text><text x="698.419" y="402.837" fill="#000" font-size="11" textLength="87.064" font-weight="700">[MAC unknown]</text><line x1="636.96" y1="442.49" x2="678.96" y2="442.49" style="stroke:#181818;stroke-width:1;"/><line x1="678.96" y1="442.49" x2="678.96" y2="455.49" style="stroke:#181818;stroke-width:1;"/><line x1="637.96" y1="455.49" x2="678.96" y2="455.49" style="stroke:#181818;stroke-width:1;"/><polygon points="647.96,451.49,637.96,455.49,647.96,459.49,643.96,455.49" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="643.96" y="436.681" fill="#000" font-size="13" font-weight="700">8</text><text x="655.396" y="436.681" fill="#000" font-size="13" textLength="175.708">detect_mac() via bluetoothctl</text><polygon points="928.171,497.196,938.171,501.196,928.171,505.196,932.171,501.196" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="636.96" y1="501.196" x2="934.171" y2="501.196" style="stroke:#181818;stroke-width:1;"/><text x="643.96" y="495.387" fill="#000" font-size="13" font-weight="700">9</text><text x="655.396" y="495.387" fill="#000" font-size="13" textLength="98.462">0x80 token / init</text><polygon points="928.171,528.902,938.171,532.902,928.171,536.902,932.171,532.902" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="636.96" y1="532.902" x2="934.171" y2="532.902" style="stroke:#181818;stroke-width:1;"/><text x="643.96" y="527.093" fill="#000" font-size="13" textLength="14.872" font-weight="700">10</text><text x="662.832" y="527.093" fill="#000" font-size="13" textLength="109.668">0x0a speed (0x55)</text><polygon points="928.171,560.608,938.171,564.608,928.171,568.608,932.171,564.608" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="636.96" y1="564.608" x2="934.171" y2="564.608" style="stroke:#181818;stroke-width:1;"/><text x="643.96" y="558.799" fill="#000" font-size="13" textLength="14.872" font-weight="700">11</text><text x="662.832" y="558.799" fill="#000" font-size="13" textLength="115.999">0x09 density (0x0c)</text><path d="M620.96,576.608 L694.248,576.608 L694.248,586.314 L684.248,596.314 L620.96,596.314 L620.96,576.608" style="stroke:#000;stroke-width:1.5;" fill="#EEE"/><rect x="620.96" y="576.608" width="335.21" height="61.412" fill="none" style="stroke:#000;stroke-width:1.5;"/><text x="635.96" y="591.505" fill="#000" font-size="13" textLength="28.288" font-weight="700">loop</text><text x="709.248" y="590.367" fill="#000" font-size="11" textLength="140.205" font-weight="700">[every 432 bytes = 4 rows]</text><polygon points="928.171,626.02,938.171,630.02,928.171,634.02,932.171,630.02" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="636.96" y1="630.02" x2="934.171" y2="630.02" style="stroke:#181818;stroke-width:1;"/><text x="643.96" y="624.211" fill="#000" font-size="13" textLength="14.872" font-weight="700">12</text><text x="662.832" y="624.211" fill="#000" font-size="13" textLength="108.849">0x00 raster frame</text><polygon points="928.171,671.726,938.171,675.726,928.171,679.726,932.171,675.726" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="636.96" y1="675.726" x2="934.171" y2="675.726" style="stroke:#181818;stroke-width:1;"/><text x="643.96" y="669.917" fill="#000" font-size="13" textLength="14.872" font-weight="700">13</text><text x="662.832" y="669.917" fill="#000" font-size="13" textLength="129.038">0x02 feed (200 steps)</text><path d="M603.286,688.726 L603.286,786.726 L973.286,786.726 L973.286,698.726 L963.286,688.726 L603.286,688.726" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><path d="M963.286,688.726 L963.286,698.726 L973.286,698.726 L963.286,688.726" style="stroke:#181818;stroke-width:0.5;" fill="#FEFFDD"/><text x="614.565" y="707.623" fill="#000" font-size="13" textLength="305.214">The whole job goes out in one continuous stream,</text><text x="614.565" y="725.329" fill="#000" font-size="13" textLength="339.001">without pauses between the blocks: a gap would let the</text><text x="614.565" y="743.035" fill="#000" font-size="13" textLength="319.189">printer's buffer run empty and stop the motor in the</text><text x="614.565" y="760.741" fill="#000" font-size="13" textLength="337.103">middle of a page.  The RFCOMM flow control blocks the</text><text x="614.565" y="778.447" fill="#000" font-size="13" textLength="264.212">writes while the printer works off its buffer.</text><polygon points="928.171,811.962,938.171,815.962,928.171,819.962,932.171,815.962" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="636.96" y1="815.962" x2="934.171" y2="815.962" style="stroke:#181818;stroke-width:1;"/><text x="643.96" y="810.153" fill="#000" font-size="13" textLength="14.872" font-weight="700">14</text><text x="662.832" y="810.153" fill="#000" font-size="13" textLength="258.531">0x10 status query (queued behind the job)</text><polygon points="647.96,843.668,637.96,847.668,647.96,851.668,643.96,847.668" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="641.96" y1="847.668" x2="939.171" y2="847.668" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="653.96" y="841.859" fill="#000" font-size="13" textLength="14.872" font-weight="700">15</text><text x="672.832" y="841.859" fill="#000" font-size="13" textLength="260.338">reply = everything was read, closing is safe</text><line x1="636.96" y1="879.374" x2="678.96" y2="879.374" style="stroke:#181818;stroke-width:1;"/><line x1="678.96" y1="879.374" x2="678.96" y2="892.374" style="stroke:#181818;stroke-width:1;"/><line x1="637.96" y1="892.374" x2="678.96" y2="892.374" style="stroke:#181818;stroke-width:1;"/><polygon points="647.96,888.374,637.96,892.374,647.96,896.374,643.96,892.374" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="643.96" y="873.565" fill="#000" font-size="13" textLength="14.872" font-weight="700">16</text><text x="662.832" y="873.565" fill="#000" font-size="13" textLength="38.818">close()</text><polygon points="39.309,920.08,29.309,924.08,39.309,928.08,35.309,924.08" fill="#181818" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="33.309" y1="924.08" x2="197.113" y2="924.08" style="stroke:#181818;stroke-width:1;stroke-dasharray:2,2;"/><text x="45.309" y="918.271" fill="#000" font-size="13" textLength="14.872" font-weight="700">17</text><text x="64.181" y="918.271" fill="#000" font-size="13" textLength="106.015">"Print job sent ..."</text><?plantuml-src PLFHQjj047pNLon-gGIEeyH9IGCfb41feQ76rE2tS99MrZNIxVLkLTdz-kxASbBJbpXePdTdP-VOSekm2jQnTJke0tN03K99NMTS1Qrr2Eb-wPMny8SiCJsJwxi2GvAOaYd09c804s6JU1FObjORnp1xAvef-lZjwpaUq5LIwAr7dJAIrkUKxN9KXc44L-UWFqAmNOxeTfaa6xZug8FW7jwc0-DUw5-mRMcMA2gajL2E0fuLJlNF70PRSJE7QF_W71QBHPQiJsHk0iQ6sWekeR9YKL2_BY4G6xRabFaw_EgYi0osCpinxpRFeIAEsXspau0ZyHd5o2hDGAJIQFpT-njbGp1HbZknLy9zDIFjJFamgli7BSavB3dDv2ejmzEdH-ZTYwF19I24YLKX2-bP6iZCtzP0qVR8HDoKt2RYHp9IjqlXvlkx79XUqCcQrba-mt83qIDMaERxszli7FiWWroqV50qBxEa9VA0lp4Su6Pv3SM1CS83t8XzGpm9F5Ndq_AIHjFXVwhoQ